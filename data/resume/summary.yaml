title: Professional Summary
subtitle: 'Full-stack Developer Specializing in Web Systems, Workflow Automation, and API Integrations'
summary: 'Full-stack Developer with professional experience building web systems, automation workflows, and business-focused digital solutions using PHP, Python, JavaScript, HTML, CSS, MySQL, PostgreSQL, Docker, and modern integration platforms. Delivered administrative systems, responsive front-end interfaces, WordPress pages, and production deployments, while also developing document automation, CRM documentation, and API-driven workflows for legal and operational contexts. Experienced in translating requirements into practical solutions, covering use case modeling, authentication, role-based access control, deployment, technical documentation, and process automation with tools such as n8n, OpenAI, Supabase, Microsoft Graph API, and WhatsApp integrations. Holds a degree in Systems Analysis and Development, communicates natively in Portuguese and professionally in English, and combines implementation focus with clear communication, organized execution, and strong alignment with business needs.'
